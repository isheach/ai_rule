name: Offline Node tests
on:
  push:
    branches: [main, feature/dsh-offpeak-schedule-20261112, security/isolated-sol-broker]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline test suite
        run: npm test
      - name: Test native credential broker offline
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\tests\sol-broker-windows.ps1
      - name: Verify Windows broker service and cross-account access offline
        if: matrix.os == 'windows-latest' && matrix.node == 22
        shell: powershell
        run: .\tests\sol-broker-windows-ci.ps1 -DisposableRunner
      - name: Install pinned WorkBuddy SDK for protocol testing
        if: matrix.os == 'windows-latest' && matrix.node == 22
        run: npm ci --ignore-scripts --prefix bridges/workbuddy
      - name: WorkBuddy SDK protocol against a local fixture
        if: matrix.os == 'windows-latest' && matrix.node == 22
        env:
          AI_RULE_TEST_WORKBUDDY_SDK: '1'
        run: node --test tests/workbuddy-sdk.test.mjs
