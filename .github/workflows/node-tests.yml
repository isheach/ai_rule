name: Offline Node tests
on:
  push:
    branches: [main, feature/dsh-offpeak-schedule-20261112]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline test suite
        run: npm test
